schema_id: news_sentiment_digest
name: News and Social Sentiment Digest
description: One agent collects current Bitcoin news and community posts, and a second
  summarizes the returned items and reads their sentiment using text-analysis tools.
nodes:
- node_id: collector
  node_type: agent
  label: News and Social Collector
  config:
    provider: openrouter
    model_id: google/gemini-2.5-flash-lite
    temperature: 0.4
    max_tokens: 2048
    completion_check_max_tokens: null
    response_format: null
    instruction:
    - Fetch up to five Bitcoin news articles through fetch_news_data using source_id='guardian',
      source_type='search', query='Bitcoin', and limit=5.
    - Fetch up to five Bitcoin community posts through fetch_social_media_data using
      source_id='lemmy', source_type='search', query='Bitcoin', and limit=5, and fetch
      up to five current Bitcoin posts using source_id='mastodon', source_type='hashtag',
      query='Bitcoin', and limit=5.
    - If either social source returns no matching posts, state that fact and use the
      matching posts returned by the other source.
    - Report only items actually returned after the search filter; do not claim five
      items when fewer matching items are available.
    - Cite the returned evidence IDs in square brackets when describing collected
      items.
    retries: 2
    retry_waiting_time: 1.5
    completion_contract:
      mode: explicit
      requirements:
      - requirement_id: recent_market_news
        description: Collect recent Bitcoin or market-related news headlines.
        evidence:
          minimum_items: 1
          minimum_records: 1
          tool_names:
          - fetch_news_data
          source_ids:
          - guardian
          source_types:
          - search
          data_types:
          - guardian_search
          required_fields: []
      - requirement_id: recent_market_social
        description: Collect recent Bitcoin or market-related social posts or community
          items.
        evidence:
          minimum_items: 1
          minimum_records: 1
          tool_names:
          - fetch_social_media_data
          source_ids:
          - lemmy
          - mastodon
          source_types:
          - search
          - hashtag
          data_types:
          - lemmy_search
          - mastodon_hashtag
          required_fields: []
      requires_final_output: true
      minimum_output_characters: 120
      required_output_fields: []
      requires_evidence_citations: true
    token_budget: 32768
    scope_window: 5
    tools: []
    tool_strict: true
    tool_choice: auto
    parallel_tool_calls: true
    call_budget: 50
    rate_limit_per_minute: 30
    few_shot_examples: []
    agent_loop_default: false
    read_upstream_state: true
    expose_downstream_state: true
    read_orchestration_state: false
  group_config: null
  position:
    x: 300.0
    y: 130.0
- node_id: analyst
  node_type: agent
  label: Sentiment Analyst
  config:
    provider: openrouter
    model_id: google/gemini-2.5-flash-lite
    temperature: 0.5
    max_tokens: 2048
    completion_check_max_tokens: null
    response_format: null
    instruction:
    - Use the text-analysis tools to summarize the collected items and to score their
      sentiment and relevance.
    - Produce a concise digest of the main themes together with an overall sentiment
      read that cites specific headlines or posts.
    - Cite the upstream and text-analysis evidence IDs in square brackets.
    retries: 3
    retry_waiting_time: 1.5
    completion_contract:
      mode: explicit
      requirements:
      - requirement_id: news_input_available
        description: Use collected news evidence in the digest.
        evidence:
          minimum_items: 1
          minimum_records: 0
          tool_names:
          - fetch_news_data
          source_ids:
          - guardian
          source_types:
          - search
          data_types:
          - guardian_search
          required_fields: []
      - requirement_id: social_input_available
        description: Use collected social evidence in the digest.
        evidence:
          minimum_items: 1
          minimum_records: 0
          tool_names:
          - fetch_social_media_data
          source_ids:
          - lemmy
          - mastodon
          source_types:
          - search
          - hashtag
          data_types:
          - lemmy_search
          - mastodon_hashtag
          required_fields: []
      - requirement_id: sentiment_scored
        description: Score the collected content for sentiment or relevance.
        evidence:
          minimum_items: 1
          minimum_records: 0
          tool_names:
          - score_text
          source_ids: []
          source_types: []
          data_types: []
          required_fields: []
      requires_final_output: true
      minimum_output_characters: 180
      required_output_fields: []
      requires_evidence_citations: true
    token_budget: 32768
    scope_window: 5
    tools: []
    tool_strict: true
    tool_choice: auto
    parallel_tool_calls: true
    call_budget: 50
    rate_limit_per_minute: 30
    few_shot_examples: []
    agent_loop_default: false
    read_upstream_state: true
    expose_downstream_state: true
    read_orchestration_state: false
  group_config: null
  position:
    x: 300.0
    y: 360.0
- node_id: fetch_feeds
  node_type: tool
  label: Fetch News and Social
  config:
    provider: openrouter
    model_id: ''
    temperature: 0.7
    max_tokens: null
    completion_check_max_tokens: null
    response_format: null
    instruction: []
    retries: 2
    retry_waiting_time: 1.5
    completion_contract:
      mode: disabled
      requirements: []
      requires_final_output: false
      minimum_output_characters: 0
      required_output_fields: []
      requires_evidence_citations: false
    token_budget: 32768
    scope_window: 5
    tools:
    - fetch_news_data
    - fetch_social_media_data
    tool_strict: true
    tool_choice: auto
    parallel_tool_calls: true
    call_budget: 50
    rate_limit_per_minute: 30
    few_shot_examples: []
    read_upstream_state: true
    expose_downstream_state: true
    read_orchestration_state: false
  group_config: null
  position:
    x: 560.0
    y: 130.0
- node_id: text_tools
  node_type: tool
  label: Text Analysis
  config:
    provider: openrouter
    model_id: ''
    temperature: 0.7
    max_tokens: null
    completion_check_max_tokens: null
    response_format: null
    instruction: []
    retries: 2
    retry_waiting_time: 1.5
    completion_contract:
      mode: disabled
      requirements: []
      requires_final_output: false
      minimum_output_characters: 0
      required_output_fields: []
      requires_evidence_citations: false
    token_budget: 32768
    scope_window: 5
    tools:
    - summarize_text
    - score_text
    - extract_entities
    - classify_text
    - chunk_text
    tool_strict: true
    tool_choice: auto
    parallel_tool_calls: true
    call_budget: 50
    rate_limit_per_minute: 30
    few_shot_examples: []
    read_upstream_state: true
    expose_downstream_state: true
    read_orchestration_state: false
  group_config: null
  position:
    x: 560.0
    y: 360.0
edges:
- edge_id: collector_self_loop
  edge_type: data_flow
  source_node_id: collector
  target_node_id: collector
  loop_rounds: 4
- edge_id: analyst_self_loop
  edge_type: data_flow
  source_node_id: analyst
  target_node_id: analyst
  loop_rounds: 4
- edge_id: collector_to_analyst
  edge_type: data_flow
  source_node_id: collector
  target_node_id: analyst
- edge_id: collector_to_feeds
  edge_type: tool_call
  source_node_id: collector
  target_node_id: fetch_feeds
- edge_id: analyst_to_text
  edge_type: tool_call
  source_node_id: analyst
  target_node_id: text_tools
config:
  total_timeout: 300
  logging_level: all
  max_loop_rounds: 10
  max_iterations: 4
  iteration_sleep: 0.0
  save_log: true
