  <g fill="#4a9eff">
    <rect x="6.5" y="14" width="5" height="7" rx="1"/>
    <rect x="13.5" y="10" width="5" height="9" rx="1"/>
    <rect x="20.5" y="14.5" width="5" height="4" rx="1" fill="#4ade80"/>
  </g>
